# Netlify build settings for CU Jammu Campus Pulse (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Single-page app: every route is served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed asset files can be cached for a year; the HTML must not be cached.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
